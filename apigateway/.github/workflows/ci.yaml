name: Deploy Microservices to ECS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com
  ECS_CLUSTER: lms-cluster

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          # =========================
          # API GATEWAY
          # =========================
          - name: api-gateway
            path: apigateway
            ecr_repo: lms-api-gateway
            ecs_service: lms-api-gateway-service
            container_name: api-gateway

          # =========================
          # SERVICE 1
          # =========================
          - name: service-1
            path: service-1
            ecr_repo: lms-service-1
            ecs_service: lms-service-1-service
            container_name: service-1

          # =========================
          # SERVICE 2
          # =========================
          - name: service-2
            path: service-2
            ecr_repo: lms-service-2
            ecs_service: lms-service-2-service
            container_name: service-2

          # =========================
          # SERVICE 3
          # =========================
          - name: service-3
            path: service-3
            ecr_repo: lms-service-3
            ecs_service: lms-service-3-service
            container_name: service-3

          # =========================
          # SERVICE 4
          # =========================
          - name: service-4
            path: service-4
            ecr_repo: lms-service-4
            ecs_service: lms-service-4-service
            container_name: service-4

          # =========================
          # SERVICE 5
          # =========================
          - name: service-5
            path: service-5
            ecr_repo: lms-service-5
            ecs_service: lms-service-5-service
            container_name: service-5

          # =========================
          # SERVICE 6
          # =========================
          - name: service-6
            path: service-6
            ecr_repo: lms-service-6
            ecs_service: lms-service-6-service
            container_name: service-6


    steps:

      # =====================================================
      # 1. CHECKOUT CODE
      # =====================================================
      - name: Checkout code
        uses: actions/checkout@v4


      # =====================================================
      # 2. SETUP JDK 17
      # =====================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven


      # =====================================================
      # 3. FIX MAVEN WRAPPER PERMISSION
      # =====================================================
      - name: Make Maven Wrapper executable
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x mvnw
          ls -l mvnw


      # =====================================================
      # 4. BUILD JAR WITH MAVEN
      # =====================================================
      - name: Build jar with Maven
        working-directory: ${{ matrix.path }}
        run: |
          ./mvnw clean package -DskipTests


      # =====================================================
      # 5. CONFIGURE AWS CREDENTIALS USING OIDC
      # =====================================================
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 6. LOGIN TO AMAZON ECR
      # =====================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # =====================================================
      # 7. BUILD DOCKER IMAGE
      # =====================================================
      - name: Build Docker image
        working-directory: ${{ matrix.path }}
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }} \
            .


      # =====================================================
      # 8. TAG IMAGE AS LATEST
      # =====================================================
      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest


      # =====================================================
      # 9. PUSH IMAGE WITH COMMIT SHA
      # =====================================================
      - name: Push image with commit SHA
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }}


      # =====================================================
      # 10. PUSH LATEST IMAGE
      # =====================================================
      - name: Push latest image
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest


      # =====================================================
      # 11. FORCE NEW ECS DEPLOYMENT
      # =====================================================
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ matrix.ecs_service }}" \
            --force-new-deployment


      # =====================================================
      # 12. WAIT FOR ECS SERVICE TO STABILIZE
      # =====================================================
      - name: Wait for ECS service
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ matrix.ecs_service }}"


      # =====================================================
      # 13. DEPLOYMENT SUCCESS
      # =====================================================
      - name: Deployment successful
        run: |
          echo "=============================================="
          echo "Deployment Successful"
          echo "Service       : ${{ matrix.name }}"
          echo "ECR Repository: ${{ matrix.ecr_repo }}"
          echo "ECS Service   : ${{ matrix.ecs_service }}"
          echo "Image Tag     : ${{ github.sha }}"
          echo "ECS Cluster   : ${{ env.ECS_CLUSTER }}"
          echo "=============================================="


          
