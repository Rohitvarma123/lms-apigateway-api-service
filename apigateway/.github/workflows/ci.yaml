name: Build and Deploy to ECS

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC auth to AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECS_CLUSTER: ecs-lms-today

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api-gateway
            path: apigateway
          - name: service-1
            path: services/service-1
          - name: service-2
            path: services/service-2
          - name: service-3
            path: services/service-3
          - name: service-4
            path: services/service-4
          - name: service-5
            path: services/service-5
          - name: service-6
            path: services/service-6
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar with Maven
        working-directory: ${{ matrix.service.path }}
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ${{ matrix.service.path }}
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/lms/${{ matrix.service.name }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.service.name }}" \
            --force-new-deployment
