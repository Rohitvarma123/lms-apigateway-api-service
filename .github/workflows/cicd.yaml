name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECS_CLUSTER: ecs-lms-today

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ---------------------------------------------------
      # 3. Fix Maven Wrapper Permission
      # ---------------------------------------------------
      - name: Give Maven Wrapper Execute Permission
        run: chmod +x mvnw


      # ---------------------------------------------------
      # 4. Verify Maven Wrapper
      # ---------------------------------------------------
      - name: Verify Maven
        run: ./mvnw --version


      # ---------------------------------------------------
      # 5. Build Application
      # ---------------------------------------------------
      - name: Build Application
        run: ./mvnw clean package -DskipTests


      # ---------------------------------------------------
      # 6. Configure AWS Credentials using OIDC
      # ---------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------
      # 7. Login to Amazon ECR
      # ---------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------
      # 8. Build Docker Image
      # ---------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ github.event.repository.name }}:${{ github.sha }} \
            .


      # ---------------------------------------------------
      # 9. Push Docker Image to ECR
      # ---------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            $ECR_REGISTRY/${{ github.event.repository.name }}:${{ github.sha }}


      # ---------------------------------------------------
      # 10. Get Current ECS Task Definition
      # ---------------------------------------------------
      - name: Download ECS Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ github.event.repository.name }} \
            --query taskDefinition \
            > task-definition.json


      # ---------------------------------------------------
      # 11. Remove unnecessary fields from task definition
      # ---------------------------------------------------
      - name: Prepare Task Definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition-clean.json


      # ---------------------------------------------------
      # 12. Update ECS Task Definition with New Image
      # ---------------------------------------------------
      - name: Update ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ github.event.repository.name }}
          image: $ECR_REGISTRY/${{ github.event.repository.name }}:${{ github.sha }}


      # ---------------------------------------------------
      # 13. Deploy New Version to ECS
      # ---------------------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ github.event.repository.name }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
